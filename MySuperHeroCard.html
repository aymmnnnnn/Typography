<!DOCTYPE html>
<html>

<head>
    <title>My Super Hero Card</title>
    <style>
        body {
            background-color: Darkblue;
            color: white;
            font-family: Arial, sans-serif;
        }

        .hero-name {
            font-size: 60px;
            font-weight: bold;
            color: yellow;
            text-shadow: 3px 3px orange;            
        }

        .tagline {
            font-style:italic;
            color: lightblue;
            text-transform:capitalize;
        }

        .label {
            text-transform: uppercase;
            text-decoration: underline;
            color: coral;
        }
        

        .power {
            font-weight: bold;
            color: limegreen;
        }

        .weakness {
            text-decoration: line-through;
            color: gray;
        }

        .badge {
            font-size: 28px;
            font-weight: bold;
            color: gold;
            transform: rotate(15deg);
        }

        .made-by {
            color: coral;
            font-style: italic;
        }
    </style>

</head>

<body>

    <h1 class="hero-name">Thunder kid</h1>
    <p class="tagline">The most powerful hero in school</p>

    <h2 class="label" >super powers</h2>
    <p class="power" >can run faster than a cheetah</p>
    <p class="power" >can lift a school bus</p>

    <h2 class="label">weaknesses</h2>
    <p class="weakness">maths homework</p>
    <p class="weakness">brocolli</p>

    <p class="badge">Top hero</p>

    <p class="made-by">created by ______________</p>

</body>

</html>
